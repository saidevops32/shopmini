name: oidc-test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-by-branch:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Who am I
        run: az account show --query "{sub:name, type:user.type}" -o table
      - name: ACR login works (AcrPush)
        run: az acr login --name "${{ vars.ACR_NAME }}"
      - name: Wide access must NOT be available
        run: |
          out=$(az group list --query "[].name" -o tsv 2>/dev/null || true)
          if [ -n "$out" ]; then
            echo "UNEXPECTED: pipeline can see resource groups: $out"; exit 1
          fi
          echo "OK: no subscription-wide access"

  login-by-environment:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name "${{ vars.ACR_NAME }}"
