apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
  namespace: shopmini
  labels:
    app: checkout-service
    tier: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
        tier: api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: checkout-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout
          image: checkout-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PG_HOST
              value: "${PG_HOST}"
            - name: PG_USER
              value: "${PG_USER}"
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: RABBITMQ_USER
              value: shop
            - name: CATALOGUE_URL
              value: http://catalogue-service
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # readiness = database only. RabbitMQ is deliberately NOT included: the outbox keeps
          # checkout accepting orders while the broker is down.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: checkout-kv
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
  namespace: shopmini
  labels:
    app: checkout-service
spec:
  selector:
    app: checkout-service
  ports:
    - name: http
      port: 80
      targetPort: http
