apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue-service
  namespace: shopmini
  labels:
    app: catalogue-service
    tier: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: catalogue-service
  template:
    metadata:
      labels:
        app: catalogue-service
        tier: api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: catalogue-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalogue
          image: catalogue-service
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MYSQL_HOST
              value: "${MYSQL_HOST}"
            - name: MYSQL_USER
              value: "${MYSQL_USER}"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # startup: JVM + Hibernate need time; allow up to 150 s
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          # readiness includes the database (application.properties readiness group)
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # liveness: application state only
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: catalogue-kv
---
apiVersion: v1
kind: Service
metadata:
  name: catalogue-service
  namespace: shopmini
  labels:
    app: catalogue-service
spec:
  selector:
    app: catalogue-service
  ports:
    - name: http
      port: 80
      targetPort: http
