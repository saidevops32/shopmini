apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: shopmini-kv
  namespace: shopmini
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${APP_MI_CLIENT_ID}"
    keyvaultName: "${KV}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: mysql-password
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
