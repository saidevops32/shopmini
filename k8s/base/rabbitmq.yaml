apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: shopmini
  labels:
    app: rabbitmq
    tier: broker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
        tier: broker
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: rabbitmq-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: rabbitmq
          # the image no longer reads RABBITMQ_DEFAULT_PASS_FILE (removed in 3.9), so read the mounted file here
          command: ["/bin/sh", "-c"]
          args:
            - 'export RABBITMQ_DEFAULT_PASS="$(cat /mnt/secrets/rabbitmq-password)"; exec docker-entrypoint.sh rabbitmq-server'
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: shop
          ports:
            - name: amqp
              containerPort: 5672
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: amqp
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/rabbitmq
            - name: secrets
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: rabbitmq-kv
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: shopmini
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
