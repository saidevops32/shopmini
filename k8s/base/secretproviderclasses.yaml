apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: auth-kv
  namespace: shopmini
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: "${AUTH_MI_CLIENT_ID}"
    keyvaultName: "${KV}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
---
