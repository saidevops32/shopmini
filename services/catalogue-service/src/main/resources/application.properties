spring.application.name=catalogue-service
server.port=8080

# graceful shutdown: finish in-flight requests on SIGTERM
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Key Vault CSI mount: each file in /mnt/secrets becomes a property named after the file
spring.config.import=optional:configtree:/mnt/secrets/

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/cataloguedb?sslMode=REQUIRED
spring.datasource.username=${MYSQL_USER:shopadmin}
spring.datasource.password=${mysql-password:${MYSQL_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# probes: liveness = process only, readiness = process + database
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never
