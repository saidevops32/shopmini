spring.application.name=checkout-service
server.port=8080
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Key Vault CSI mount: each file in /mnt/secrets becomes a property named after the file
spring.config.import=optional:configtree:/mnt/secrets/

spring.datasource.url=jdbc:postgresql://${PG_HOST:localhost}:5432/orderdb?sslmode=require
spring.datasource.username=${PG_USER:shopadmin}
spring.datasource.password=${postgres-password:${PG_PASSWORD:}}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:shop}
spring.rabbitmq.password=${rabbitmq-password:${RABBITMQ_PASSWORD:}}
spring.rabbitmq.publisher-confirm-type=simple

catalogue.base-url=${CATALOGUE_URL:http://catalogue-service}

# probes: liveness = process only; readiness = process + database.
# RabbitMQ is deliberately NOT in readiness: the outbox lets us keep taking orders without it.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
server.error.include-message=never
